<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>League Account Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">League Account Manager</div>
    <div class="window-controls">
      <button class="win-ctrl-btn" id="win-minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor" /></svg>
      </button>
      <button class="win-ctrl-btn win-ctrl-close" id="win-close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <line x1="1.5" y1="1.5" x2="10.5" y2="10.5" stroke="currentColor" stroke-width="1.3" />
          <line x1="10.5" y1="1.5" x2="1.5" y2="10.5" stroke="currentColor" stroke-width="1.3" />
        </svg>
      </button>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <h2>Riot Client</h2>
      <p class="hint" id="riot-path-hint">Not set.</p>
      <button class="btn ghost" id="pick-riot-path">Locate RiotClientServices.exe</button>
    </div>

    <div class="card">
      <div class="row spread">
        <h2>Accounts</h2>
        <button class="btn" id="save-profile">Save current session</button>
      </div>
      <p class="hint">
        Log into an account in the Riot Client with "Stay signed in" checked, then save it here.
        Switching never re-prompts for 2FA as long as that session stays saved.
      </p>
      <div id="profile-list" class="profile-list"></div>
      <div id="profile-empty" class="empty">No saved accounts yet.</div>
    </div>

    <div class="card">
      <h2>Version</h2>
      <p class="hint" id="version-hint">Installed: v?</p>
      <div class="row">
        <button class="btn ghost" id="check-updates">Check again</button>
      </div>
      <div id="update-banner"></div>
      <div id="version-table"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
